name: asset
on:
  push:
    branches: [main]
    paths: ['package.json', 'scripts/workspace.mjs', 'asset/**', 'simulations/**', 'sdk/**', 'core/**', 'protocol/**', '.github/workflows/asset.yml']
  pull_request:
    paths: ['package.json', 'scripts/workspace.mjs', 'asset/**', 'simulations/**', 'sdk/**', 'core/**', 'protocol/**', '.github/workflows/asset.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          if [ ! -x /usr/bin/node ]; then sudo ln -s "$(command -v node)" /usr/bin/node; fi
      - run: npm run setup -- simulations
      - run: npm run check -- asset
      - run: npm run check:sitl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-sitl-evidence
          path: /tmp/atlas-sitl-flight-*
