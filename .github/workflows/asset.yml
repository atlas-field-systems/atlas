name: asset
on:
  push:
    branches: [main]
    paths: ['asset/**', 'simulations/**', 'sdk/**', 'core/**', 'protocol/**', '.github/workflows/asset.yml']
  pull_request:
    paths: ['asset/**', 'simulations/**', 'sdk/**', 'core/**', 'protocol/**', '.github/workflows/asset.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: protocol
      - run: npm ci
        working-directory: core
      - run: npm ci
        working-directory: sdk
      - run: npm ci
        working-directory: asset
      - run: npx tsc --noEmit && npm test && node src/main.ts inspect examples/copter.json
        working-directory: asset
      - run: npm ci
        working-directory: simulations
      - run: node simulations/scripts/fetch-sitl.mjs
      - run: node --test sitl/flight.test.ts
        working-directory: simulations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-sitl-evidence
          path: /tmp/atlas-sitl-flight-*
