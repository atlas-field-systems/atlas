name: core
on:
  push:
    branches: [main]
    paths: ['core/**', 'protocol/**', '.github/workflows/core.yml']
  pull_request:
    paths: ['core/**', 'protocol/**', '.github/workflows/core.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: protocol
      - run: npm ci
        working-directory: core
      - run: npx tsc --noEmit
        working-directory: core
      - run: npm test
        working-directory: core
