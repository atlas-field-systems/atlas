name: docs
on:
  push:
    branches: [main]
    paths: ['**.md', '.github/scripts/check-links.mjs', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**.md', '.github/scripts/check-links.mjs', '.github/workflows/docs.yml']
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-links.mjs
