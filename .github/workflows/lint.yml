name: lint
on:
  push:
    branches: [main]
    paths: ['protocol/**', 'core/**', 'sdk/**', 'asset/**', 'fieldlink/**', 'gateway/**', 'simulations/**', 'package*.json', 'eslint.config.mjs', 'scripts/workspace.mjs', 'scripts/lint.mjs', 'scripts/lint.test.mjs', '.github/workflows/lint.yml']
  pull_request:
    paths: ['protocol/**', 'core/**', 'sdk/**', 'asset/**', 'fieldlink/**', 'gateway/**', 'simulations/**', 'package*.json', 'eslint.config.mjs', 'scripts/workspace.mjs', 'scripts/lint.mjs', 'scripts/lint.test.mjs', '.github/workflows/lint.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run setup -- lint
      - run: npm run check -- lint
