name: protocol-bump
# Moves Core's pin (core/package.json "protocol") to Protocol's newest release tag
# (protocol-v<major.minor>.<patch>), never to protocol/ on main, so Core changes Protocol version
# only on purpose. Runs hourly or by hand.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: bump
        run: |
          pinned=$(node -p "require('./package.json').protocol")
          tag=$(git tag -l 'protocol-v*' --sort=-v:refname | grep -E '^protocol-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$tag" ] && [ "$tag" != "protocol-$pinned" ] && git merge-base --is-ancestor "protocol-$pinned" "$tag"; then
            sed -i "s/\"protocol\": \"$pinned\"/\"protocol\": \"${tag#protocol-}\"/" package.json
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.bump.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.bump.outputs.changed == 'true'
        run: npm ci && npm test
      - if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git -c user.name=the-Drunken-coder -c user.email=183743141+the-Drunken-coder@users.noreply.github.com commit -qam "Bump Core's Protocol to $TAG"
          git push -f origin HEAD:protocol-bump
          gh pr view protocol-bump >/dev/null 2>&1 || gh pr create --head protocol-bump --base main --title "Bump Core's Protocol to a new release" --body "Automatic: core/package.json now pins Protocol release $TAG. Core's tests passed in the protocol-bump workflow. Do not merge without approval."
