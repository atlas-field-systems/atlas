name: release
# Pushing to prod makes the releases: git push origin main:prod
# Only commits on main are released. Each part releases only if it changed since its last tag.
# Protocol tags protocol-v<major.minor>.<patch>: major.minor is the protocol version
# (protocol_version.json); the patch counts releases that change no message, such as SDK fixes.
# Core tags core-v<version> from core/package.json, and only on the Protocol release it pins.
# A rerun finishes a release whose GitHub release is missing.
on:
  push:
    branches: [prod]
permissions:
  contents: write
concurrency: release
env:
  GIT_AUTHOR: -c user.name=the-Drunken-coder -c user.email=183743141+the-Drunken-coder@users.noreply.github.com
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run check && npm test
      - id: plan
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::prod must be a commit on main. Release with: git push origin main:prod"; exit 1; }
          wire=$(node -p "require('./definitions/variables/protocol_version.json').examples[0]")
          latest=$(git tag -l "protocol-v$wire.*" --sort=-v:refname | grep -E "^protocol-v${wire//./\\.}\.[0-9]+$" | head -1 || true)
          next=
          if [ -z "$latest" ]; then
            next="protocol-v$wire.0"
          elif git merge-base --is-ancestor HEAD "$latest" || git diff --quiet "$latest" HEAD -- . ':!*.md' ':!docs'; then
            echo "Nothing new since $latest."
          elif ! git diff --quiet "$latest" HEAD -- definitions storage; then
            echo "::error::The protocol changed since $latest. Run npm run bump on main first."; exit 1
          else
            next="protocol-v$wire.$(( ${latest##*.} + 1 ))"
          fi
          target=${next:-$latest}
          [ -n "$next" ] || git merge-base --is-ancestor "$target" origin/main || { echo "::error::$target is not on main, so it is not released."; exit 1; }
          if [ "${target##*.}" = 0 ]; then
            awk -v h="## $wire" '$0 == h { f = 1; next } /^## / { f = 0 } f' docs/changelog.md > "$RUNNER_TEMP/notes.md"
            grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::docs/changelog.md has no ## $wire section"; exit 1; }
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "wire=$wire" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.plan.outputs.next }}
          TARGET: ${{ steps.plan.outputs.target }}
          WIRE: ${{ steps.plan.outputs.wire }}
        run: |
          if [ -n "$NEXT" ]; then
            git $GIT_AUTHOR tag -a "$NEXT" -m "Protocol ${NEXT#protocol-}"
            git push origin "$NEXT"
          fi
          if gh release view "$TARGET" >/dev/null 2>&1; then echo "$TARGET already has its GitHub release."; exit 0; fi
          if [ "${TARGET##*.}" = 0 ]; then
            gh release create "$TARGET" --verify-tag --title "Protocol ${TARGET#protocol-}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TARGET" --verify-tag --title "Protocol ${TARGET#protocol-}" --notes "No message changes; protocol version $WIRE." --generate-notes
          fi

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::prod must be a commit on main. Release with: git push origin main:prod"; exit 1; }
          p=protocol-$(node -p "require('./package.json').protocol")
          git rev-parse -q --verify "refs/tags/$p" >/dev/null || { echo "::error::core/package.json pins $p, which is not a Protocol release. Core releases only on a released Protocol."; exit 1; }
          v=core-v$(node -p "require('./package.json').version")
          next=$v
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            next=
            if ! git merge-base --is-ancestor HEAD "$v" && ! git diff --quiet "$v" HEAD -- . ':!*.md' ':!docs'; then
              echo "::error::$v is already released and Core changed since. Raise the version in core/package.json on main first."; exit 1
            fi
            git merge-base --is-ancestor "$v" origin/main || { echo "::error::$v is not on main, so it is not released."; exit 1; }
            echo "Nothing new since $v."
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "target=$v" >> "$GITHUB_OUTPUT"
          echo "protocol=$p" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.next != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.plan.outputs.next != ''
        run: npm ci && npm test
      - env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.plan.outputs.next }}
          TARGET: ${{ steps.plan.outputs.target }}
          P: ${{ steps.plan.outputs.protocol }}
        run: |
          if [ -n "$NEXT" ]; then
            git $GIT_AUTHOR tag -a "$NEXT" -m "Core ${NEXT#core-} on Protocol ${P#protocol-}"
            git push origin "$NEXT"
          fi
          if gh release view "$TARGET" >/dev/null 2>&1; then echo "$TARGET already has its GitHub release."; exit 0; fi
          gh release create "$TARGET" --verify-tag --title "Core ${TARGET#core-}" --notes "Speaks Protocol ${P#protocol-}." --generate-notes
