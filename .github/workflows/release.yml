name: release
# Pushing to prod releases the retained Core prototype from a commit on main.
# Protocol package publishing is not configured yet; its package version will be
# its only release identity. The prototype keeps its historical Protocol pin.
on:
  push:
    branches: [prod]
permissions:
  contents: write
concurrency: release
env:
  GIT_AUTHOR: -c user.name=the-Drunken-coder -c user.email=183743141+the-Drunken-coder@users.noreply.github.com
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::prod must be a commit on main. Release with: git push origin main:prod"; exit 1; }
          p=protocol-$(node -p "require('./package.json').protocol")
          git rev-parse -q --verify "refs/tags/$p" >/dev/null || { echo "::error::core/package.json pins $p, which is not a Protocol release. Core releases only on a released Protocol."; exit 1; }
          v=core-v$(node -p "require('./package.json').version")
          next=$v
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            next=
            if ! git merge-base --is-ancestor HEAD "$v" && ! git diff --quiet "$v" HEAD -- . ':!*.md' ':!docs'; then
              echo "::error::$v is already released and Core changed since. Raise the version in core/package.json on main first."; exit 1
            fi
            git merge-base --is-ancestor "$v" origin/main || { echo "::error::$v is not on main, so it is not released."; exit 1; }
            echo "Nothing new since $v."
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "target=$v" >> "$GITHUB_OUTPUT"
          echo "protocol=$p" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.next != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.plan.outputs.next != ''
        run: npm ci && npm test
      - env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.plan.outputs.next }}
          TARGET: ${{ steps.plan.outputs.target }}
          P: ${{ steps.plan.outputs.protocol }}
        run: |
          if [ -n "$NEXT" ]; then
            git $GIT_AUTHOR tag -a "$NEXT" -m "Core ${NEXT#core-} on Protocol ${P#protocol-}"
            git push origin "$NEXT"
          fi
          if gh release view "$TARGET" >/dev/null 2>&1; then echo "$TARGET already has its GitHub release."; exit 0; fi
          gh release create "$TARGET" --verify-tag --title "Core ${TARGET#core-}" --notes "Speaks Protocol ${P#protocol-}." --generate-notes
