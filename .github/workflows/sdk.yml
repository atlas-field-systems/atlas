name: sdk
on:
  push:
    branches: [main]
    paths: ['package.json', 'scripts/workspace.mjs', 'sdk/**', 'core/**', 'protocol/**', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['package.json', 'scripts/workspace.mjs', 'sdk/**', 'core/**', 'protocol/**', '.github/workflows/sdk.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run setup -- sdk
      - run: npm run check -- sdk
