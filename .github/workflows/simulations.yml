name: simulations
on:
  push:
    branches: [main]
    paths: ['package.json', 'scripts/workspace.mjs', 'asset/**', 'simulations/**', 'sdk/**', 'core/**', 'protocol/**', '.github/workflows/simulations.yml']
  pull_request:
    paths: ['package.json', 'scripts/workspace.mjs', 'asset/**', 'simulations/**', 'sdk/**', 'core/**', 'protocol/**', '.github/workflows/simulations.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run setup -- simulations
      - name: Check tmpfs mount permission
        run: sudo -n true
      - run: npm run check -- simulations
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-evidence
          path: simulations/.runs
          include-hidden-files: true
