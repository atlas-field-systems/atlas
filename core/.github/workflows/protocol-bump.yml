name: protocol-bump
# Moves protocol/ to Protocol's newest release tag (v<major.minor>.<patch>), never to its main,
# so Core changes Protocol version only on purpose. Runs hourly or by hand.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: bump
        run: |
          if [ "$(git -C protocol rev-parse --is-shallow-repository)" = true ]; then git -C protocol fetch -q --unshallow origin; fi
          git -C protocol fetch -q --tags origin
          tag=$(git -C protocol tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$tag" ] && git -C protocol merge-base --is-ancestor HEAD "$tag"; then git -C protocol checkout -q "$tag"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.bump.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.bump.outputs.changed == 'true'
        run: npm ci && npm test
      - if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git -c user.name=the-Drunken-coder -c user.email=183743141+the-Drunken-coder@users.noreply.github.com commit -qam "Bump protocol to $TAG"
          git push -f origin HEAD:protocol-bump
          gh pr view protocol-bump >/dev/null 2>&1 || gh pr create --head protocol-bump --base main --title "Bump protocol to a new release" --body "Automatic: protocol/ moved to Protocol release $TAG. Tests passed in the protocol-bump workflow. Do not merge without approval."
