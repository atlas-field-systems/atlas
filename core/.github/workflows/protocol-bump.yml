name: protocol-bump
# Keeps protocol/ on Protocol's newest main. Runs hourly, by hand, or when Protocol
# sends a "protocol-main" repository_dispatch (that needs a token on Protocol's side).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [protocol-main]
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: bump
        run: |
          git -C protocol fetch -q origin main
          git -C protocol checkout -q origin/main
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.bump.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.bump.outputs.changed == 'true'
        run: npm ci && npm test
      - if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git -C protocol rev-parse --short HEAD)
          git -c user.name=the-Drunken-coder -c user.email=183743141+the-Drunken-coder@users.noreply.github.com commit -qam "Bump protocol to $sha"
          git push -f origin HEAD:protocol-bump
          gh pr view protocol-bump >/dev/null 2>&1 || gh pr create --head protocol-bump --base main --title "Bump protocol" --body "Automatic: protocol/ moved to Protocol main. Tests passed in the protocol-bump workflow. Do not merge without approval."
