<!doctype html>
<meta charset="utf-8">
<title>Atlas Core prototype</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1rem; display: grid; grid-template-columns: 18rem 1fr; gap: 1rem; }
  svg { width: 100%; height: 80vh; background: #f4f6f8; border: 1px solid #ccc; }
  .asset { border: 1px solid #ccc; padding: .5rem; margin-bottom: .5rem; } pre { white-space: pre-wrap; font-size: 12px; }
</style>
<div><h3>Assets</h3><div id="assets"></div><pre id="log"></pre></div>
<svg id="map" viewBox="0 0 1000 1000"><g id="paths"></g></svg>
<script type="module">
// Credentials come from the address: http://host/#OP1:key (not stored anywhere).
const [operator_id, key] = decodeURIComponent(location.hash.slice(1)).split(':');
const VERSION = '__PROTOCOL_VERSION__';
const ws = new WebSocket(`ws://${location.host}/operator?${new URLSearchParams({ operator_id, key })}`);
let seq = 0;
const send = (m) => ws.send(JSON.stringify({ type: m.type, time: Date.now(), seq: seq++, ...m }));
const assets = {}; // asset_id -> { hello, state: {}, path: [] }
const log = (t) => { document.querySelector('#log').textContent = `${t}\n${document.querySelector('#log').textContent}`.slice(0, 4000); };
ws.onopen = () => send({ type: 'admin.operator_hello', operator_id, protocol_version: VERSION });
ws.onclose = () => log('disconnected');
ws.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.type === 'admin.reply') return m.reply_result === 'refused' && log(`refused: ${m.explanation}`);
  if (m.type === 'admin.hello_reply') return log(`hello: ${m.hello_result}`);
  const a = assets[m.asset_id] ??= { state: {}, path: [], seen: new Set() };
  if (m.type === 'admin.hello') { a.hello = m; send({ type: 'query.core', kind: 'history', asset_id: m.asset_id, report: 'telemetry' }); }
  else if (m.type === 'report.telemetry') { if (!a.seen.has(m.time)) { a.seen.add(m.time); a.path.push(m); a.path.sort((x, y) => x.time - y.time); } }
  else if (m.type === 'report.status' && m.kind === 'task') { a.state[`task ${m.task_id}`] = m.task_state; }
  else a.state[m.kind ?? m.type.split('.')[1]] = m.condition ?? m.battery_percent ?? m.task_ids?.join(' ') ?? m.response ?? m.run_state ?? '';
  draw();
};
function draw() {
  const pts = Object.values(assets).flatMap((a) => a.path.map((t) => t.position));
  if (!pts.length) return;
  const lat = pts.map((p) => p.latitude), lon = pts.map((p) => p.longitude);
  const span = Math.max(Math.max(...lat) - Math.min(...lat), Math.max(...lon) - Math.min(...lon), 1e-4);
  const x = (p) => 50 + 900 * (p.longitude - Math.min(...lon)) / span, y = (p) => 950 - 900 * (p.latitude - Math.min(...lat)) / span;
  document.querySelector('#paths').innerHTML = Object.entries(assets).map(([id, a]) => {
    const last = a.path.at(-1)?.position; if (!last) return '';
    return `<polyline fill="none" stroke="#1565c0" stroke-width="3" points="${a.path.map((t) => `${x(t.position)},${y(t.position)}`).join(' ')}"/>
      <circle cx="${x(last)}" cy="${y(last)}" r="10" fill="#c62828"/><text x="${x(last) + 14}" y="${y(last)}">${id} ${last.altitudes[0].altitude_m} m</text>`;
  }).join('');
  document.querySelector('#assets').innerHTML = Object.entries(assets).map(([id, a]) =>
    `<div class="asset"><b>${id}</b> ${(a.hello?.commands ?? []).join(', ')}<br>${Object.entries(a.state).map(([k, v]) => `${k}: ${v}`).join('<br>')}</div>`).join('');
}
</script>
