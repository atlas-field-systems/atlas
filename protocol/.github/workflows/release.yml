name: release
# Pushing to production makes the release: tag v<version> and a GitHub release from
# docs/changelog.md. production only moves forward to a commit on main:
#   git push origin main:production
on:
  push:
    branches: [production]
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run check && npm test
      - id: plan
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::production must be a commit on main. Release with: git push origin main:production"; exit 1; }
          v=$(node -p "require('./definitions/variables/protocol_version.json').examples[0]")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            if git diff --quiet "v$v" HEAD -- definitions examples storage docs sdk; then
              echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$v is already released and nothing in the protocol changed since."; exit 0
            fi
            echo "::error::v$v is already released and the protocol changed since. Run npm run bump on main first."; exit 1
          fi
          awk -v h="## $v" '$0 == h { f = 1; next } /^## / { f = 0 } f' docs/changelog.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::docs/changelog.md has no ## $v section"; exit 1; }
          echo "release=true" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.plan.outputs.version }}
        run: |
          git -c user.name=the-Drunken-coder -c user.email=183743141+the-Drunken-coder@users.noreply.github.com tag -a "v$V" -m "Protocol $V"
          git push origin "v$V"
          gh release create "v$V" --verify-tag --title "Protocol $V" --notes-file "$RUNNER_TEMP/notes.md"
